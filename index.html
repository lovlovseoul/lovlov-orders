<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>LOVLOV 중국사입 주문 현황</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+KR:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
/* Layout: sticky bar (name, role, language) > status strip (filter chips) > tabs > list or arrival groups; order detail slides in from the right with two input blocks (KR / CN) and a message thread. */
:root{
  --bg:#F6F5FA; --surface:#FFFFFF; --surface2:#EFEDF6; --line:#DDD9EA;
  --fg:#1D1A2B; --fg2:#5E5972; --accent:#5B3FD1; --accent-fg:#FFFFFF;
  --s-draft:#8A859C; --s-ordered:#6B63C9; --s-producing:#B7791F; --s-ready:#0F8C86;
  --s-shipped:#1C74C4; --s-received:#2E8B57; --s-hold:#C2415A;
  --late:#C2415A;
  --font-body:"Noto Sans KR","Noto Sans SC",system-ui,-apple-system,"Segoe UI","Apple SD Gothic Neo","PingFang SC","Microsoft YaHei",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14121C; --surface:#1D1A29; --surface2:#262234; --line:#34304A;
    --fg:#ECE9F5; --fg2:#A9A3BE; --accent:#9B86F5; --accent-fg:#14121C;
    --s-draft:#9A95AD; --s-ordered:#9A93E8; --s-producing:#E2A94B; --s-ready:#3CC0B8;
    --s-shipped:#58A6F0; --s-received:#5BC088; --s-hold:#E87891; --late:#F08099;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#14121C; --surface:#1D1A29; --surface2:#262234; --line:#34304A;
  --fg:#ECE9F5; --fg2:#A9A3BE; --accent:#9B86F5; --accent-fg:#14121C;
  --s-draft:#9A95AD; --s-ordered:#9A93E8; --s-producing:#E2A94B; --s-ready:#3CC0B8;
  --s-shipped:#58A6F0; --s-received:#5BC088; --s-hold:#E87891; --late:#F08099;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{color-scheme:light}
body{margin:0}
img{max-width:100%}
.loginbox{width:min(380px,100%);margin:40px auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:12px}
.loginbox h2{margin:0;font-size:18px}
.loginbox p{margin:0;color:var(--fg2);font-size:13px}
.loginbox .err{color:var(--late)}
html[lang="zh"]{--font-body:"Noto Sans SC","Noto Sans KR",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:14px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.inner{max-width:1180px;margin:0 auto}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.bar .inner{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding-block:10px}
.brand{display:flex;flex-direction:column;min-width:0;margin-right:auto}
.brand b{font-size:16px;font-weight:700;letter-spacing:-.01em}
.brand span{font-size:12px;color:var(--fg2)}
.conn{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--fg2)}
.conn i{width:7px;height:7px;border-radius:50%;background:var(--s-draft)}
.conn[data-s="live"] i{background:var(--s-received)}
.conn[data-s="off"] i{background:var(--s-hold)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface2)}
.seg button{border:0;background:transparent;padding:6px 12px;font-size:13px;color:var(--fg2);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);font-weight:500}
.ctl{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
.ctl small{font-size:11px;color:var(--fg2)}

main{padding-block:16px 64px}
.banner{margin:0 0 12px;padding:8px 12px;border-radius:8px;background:var(--surface2);border:1px solid var(--line);font-size:13px;color:var(--fg2)}

/* status strip */
.strip{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:flex;align-items:center;gap:8px;padding:7px 11px;border:1px solid var(--line);background:var(--surface);border-radius:8px;font-size:13px;--c:var(--fg2)}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--c)}
.chip b{font-family:var(--font-mono);font-weight:500}
.chip span.q{font-family:var(--font-mono);font-size:12px;color:var(--fg2)}
.chip[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--surface))}
.flow{display:flex;height:6px;border-radius:3px;overflow:hidden;margin:12px 0 4px;background:var(--surface2)}
.flow i{display:block;height:100%}

/* tabs + tools */
.tools{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:18px 0 10px}
.tabs{display:flex;gap:4px;margin-right:auto}
.tabs button{border:0;background:transparent;padding:8px 12px;font-size:14px;color:var(--fg2);border-bottom:2px solid transparent}
.tabs button[aria-selected="true"]{color:var(--fg);font-weight:700;border-bottom-color:var(--accent)}
.search{min-width:0;flex:1 1 180px;max-width:280px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.btn{padding:7px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:13px}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:500}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.danger{color:var(--late);border-color:color-mix(in srgb,var(--late) 40%,var(--line))}

/* rows */
.table{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.head,.row{display:grid;grid-template-columns:104px minmax(0,1.3fr) 112px 150px minmax(0,1.2fr) 44px;gap:12px;align-items:center;padding:10px 14px;text-align:left;width:100%}
.head{font-size:12px;color:var(--fg2);background:var(--surface2);border-bottom:1px solid var(--line)}
.row{border:0;border-bottom:1px solid var(--line);background:transparent}
.row:last-child{border-bottom:0}
.row:hover{background:color-mix(in srgb,var(--accent) 5%,var(--surface))}
.row > span{min-width:0}
.c-prod{display:flex;gap:10px;align-items:center}
.th{flex:0 0 44px;height:56px;border-radius:6px;background:var(--surface2);overflow:hidden}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.tx{min-width:0}
.c-prod b{display:block;font-weight:500;overflow-wrap:anywhere}
label.btn{cursor:pointer;display:inline-block}
.photo{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.photo img{width:100%;max-height:340px;object-fit:contain;background:var(--surface2);border-radius:10px;border:1px solid var(--line)}
.phEmpty{width:100%;padding:28px 12px;text-align:center;border:1px dashed var(--line);border-radius:10px;color:var(--fg2);font-size:13px}
.phBtns{display:flex;gap:8px}
.c-prod small,.c-eta small{display:block;font-size:12px;color:var(--fg2)}
.c-qty{font-size:13px}
.c-qty small{display:block;font-size:11px;color:var(--fg2)}
.c-note{font-size:12px;color:var(--fg2);overflow-wrap:anywhere}
.c-note div{display:flex;gap:6px}
.c-note em{font-style:normal;font-family:var(--font-mono);font-size:10px;padding:0 4px;border-radius:3px;background:var(--surface2);align-self:flex-start;margin-top:2px}
.c-msg{justify-self:end}
.badge{display:inline-flex;min-width:22px;justify-content:center;padding:1px 6px;border-radius:10px;background:var(--surface2);font-family:var(--font-mono);font-size:11px;color:var(--fg2)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:12px;font-size:12px;font-weight:500;white-space:nowrap;color:var(--c);background:color-mix(in srgb,var(--c) 14%,var(--surface))}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c)}
.conf{display:inline-flex;align-items:center;gap:5px;font-size:12px}
.conf i{width:7px;height:7px;border-radius:50%;background:var(--c)}
.late{color:var(--late)}
.tag{display:inline-block;margin-left:6px;padding:0 6px;border-radius:4px;font-size:11px;font-weight:400;background:var(--surface2);color:var(--fg2)}
.empty{padding:36px 16px;text-align:center;color:var(--fg2)}
.empty b{display:block;color:var(--fg);margin-bottom:4px}

/* arrivals */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-bottom:14px}
.tile{padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.tile small{display:block;font-size:12px;color:var(--fg2)}
.tile b{font-family:var(--font-mono);font-size:22px;font-weight:500}
.tile b span{font-family:var(--font-body);font-size:13px;color:var(--fg2);margin-left:4px}
.grp{margin-bottom:14px}
.grp h3{margin:0 0 6px;font-size:13px;font-weight:700;display:flex;align-items:center;gap:8px;color:var(--c)}
.grp h3 i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.arow{grid-template-columns:128px 104px minmax(0,1.3fr) 112px minmax(0,1.2fr) 44px}
.grow,.ghead{grid-template-columns:minmax(0,1.1fr) 52px 96px 104px 140px minmax(0,1.2fr) 40px}
.glist{display:flex;flex-direction:column;gap:12px}
.ghd{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--surface2);border-bottom:1px solid var(--line)}
.ghd .gtx{flex:1;min-width:0}
.ghd b{font-size:15px;overflow-wrap:anywhere}
.ghd small{display:block;font-size:12px;color:var(--fg2)}
.ghd .th{flex:0 0 52px;height:66px}
.ghd .gbtn{display:flex;align-items:center;gap:12px;flex:1;min-width:0;background:none;border:0;padding:0;margin:0;font:inherit;color:inherit;text-align:left;cursor:pointer}
.ghd .gbtn .gtx{display:block}
.ghd .gbtn:hover b{text-decoration:underline}
.blk.locked .fld{opacity:.55}
.gsl{display:flex;flex-direction:column;align-items:flex-end;gap:2px;font-size:11px;color:var(--fg2);text-align:right}
.gsl svg{display:block}
.drawer .row.grow{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"prod status" "qty eta" "note note";gap:6px 12px}
.drawer .row .c-prod{grid-area:prod}.drawer .row .c-status{grid-area:status;justify-self:end}.drawer .row .c-qty{grid-area:qty}.drawer .row .c-eta{grid-area:eta;justify-self:end;text-align:right}.drawer .row .c-note{grid-area:note}.drawer .row .c-msg,.drawer .row .c-round{display:none}
.gq{font-family:var(--font-mono);font-size:16px;white-space:nowrap}
.gq small{display:inline;margin-left:3px;font-family:var(--font-body)}
.c-round{font-size:12px;color:var(--fg2)}.c-round small{display:block;font-size:11px}.stkn{color:var(--accent)!important}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,8,20,.45);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100vw);background:var(--bg);z-index:50;display:flex;flex-direction:column;box-shadow:-12px 0 32px rgba(10,8,20,.25)}
.dhead{display:flex;gap:10px;align-items:flex-start;padding:calc(14px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 12px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.dhead h2{margin:0;font-size:17px;line-height:1.3;overflow-wrap:anywhere}
.dhead p{margin:2px 0 0;font-size:12px;color:var(--fg2)}
.dhead .x{margin-left:auto;border:0;background:transparent;font-size:22px;line-height:1;color:var(--fg2);padding:2px 6px}
.dbody{overflow-y:auto;padding:14px max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) 16px;display:flex;flex-direction:column;gap:14px}
.steps{display:flex;gap:4px}
.steps i{flex:1;height:5px;border-radius:3px;background:var(--surface2)}
.steps i.on{background:var(--c)}
.blk{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.blk h3{margin:0 0 10px;font-size:13px;display:flex;justify-content:space-between;gap:8px}
.blk h3 span{font-weight:400;font-size:12px;color:var(--fg2)}
.blk.locked{background:var(--surface2)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fld{display:flex;flex-direction:column;gap:3px;min-width:0}
.fld.full{grid-column:1/-1}
.fld label{font-size:12px;color:var(--fg2)}
.fld input,.fld select,.fld textarea{width:100%;min-width:0;padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:var(--bg)}
.fld textarea{min-height:60px;resize:vertical}
.fld :disabled{background:transparent;border-color:transparent;padding-left:0;opacity:1;-webkit-text-fill-color:var(--fg)}
.stat{display:flex;flex-direction:column;gap:3px}
.stat select{padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:var(--surface)}
.thread{display:flex;flex-direction:column;gap:8px}
.msgs{display:flex;flex-direction:column;gap:8px;max-height:260px;overflow-y:auto}
.msg{max-width:88%;padding:7px 10px;border-radius:10px;background:var(--surface);border:1px solid var(--line);font-size:13px;overflow-wrap:anywhere;white-space:pre-wrap}
.msg.mine{align-self:flex-end;background:color-mix(in srgb,var(--accent) 12%,var(--surface))}
.msg .meta{display:block;font-size:11px;color:var(--fg2);margin-bottom:2px;white-space:normal}
.compose{display:flex;gap:8px;align-items:flex-end}
.compose textarea{flex:1;min-width:0;min-height:42px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);resize:vertical}
.foot{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--fg2)}

dialog{border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--fg);padding:18px;width:min(420px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(10,8,20,.45)}
dialog h2{margin:0 0 12px;font-size:16px}
dialog .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.chk{display:inline-block;flex:0 0 18px;width:18px;height:18px;border:2px solid var(--fg2);border-radius:4px;margin-right:8px;vertical-align:middle;position:relative}
.chk.on{background:var(--fg);border-color:var(--fg)}
.chk.on:after{content:"";position:absolute;left:4px;top:0;width:5px;height:10px;border:solid var(--bg);border-width:0 2px 2px 0;transform:rotate(45deg)}
.row.sel{background:var(--surface2)}
.c-prod{display:flex;align-items:center}
.gchk{background:none;border:0;padding:4px;cursor:pointer;display:flex;align-items:center}
.gchk .chk{margin:0}
.selbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:70;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);box-shadow:0 6px 24px rgba(0,0,0,.25);max-width:calc(100vw - 24px)}
.selbar[hidden]{display:none}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:60;padding:8px 14px;border-radius:8px;background:var(--fg);color:var(--bg);font-size:13px}

@media (max-width:860px){
  .head{display:none}
  .row,.arow{grid-template-columns:1fr auto;grid-template-areas:"prod status" "qty eta" "note note"}
  .row .c-prod{grid-area:prod}.row .c-status{grid-area:status;justify-self:end}
  .row .c-qty{grid-area:qty}.row .c-eta{grid-area:eta;justify-self:end;text-align:right}
  .row .c-note{grid-area:note}.row .c-msg{display:none}
  .arow .c-date{display:none}
  .row .c-round{display:none}
  .ghd{flex-wrap:wrap}
}
@media (max-width:520px){ .grid2{grid-template-columns:1fr} }
@media (prefers-reduced-motion:no-preference){ .drawer{animation:slide .18s ease-out} @keyframes slide{from{transform:translateX(24px);opacity:0}} }
.brandbar{margin:0 0 12px;display:inline-flex}.brandbar button b{font-weight:600;margin-left:5px;opacity:.75}.btag{display:inline-block;font-size:11px;font-weight:600;padding:1px 6px;border-radius:5px;margin-right:6px;vertical-align:1px;background:var(--line);color:var(--fg2)}.btag.lessetter{background:#e8dccb;color:#6b4a1e}@media (prefers-color-scheme:dark){.btag.lessetter{background:#4a3a24;color:#e8cfa4}}
.brow{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr) 84px 120px minmax(0,1fr) 104px}.bhd{display:flex;justify-content:space-between;align-items:center;margin:0 0 8px}.bhd .seg{display:inline-flex}.btot{font-family:var(--font-mono);font-size:13px;color:var(--fg2)}@media (max-width:860px){.brow{grid-template-columns:1fr auto;grid-template-areas:"prod status" "qty eta" "note note"}.brow .c-prod{grid-area:prod}.brow .c-status{grid-area:status;justify-self:end}.brow .c-qty{grid-area:qty}.brow .c-eta{grid-area:eta;justify-self:end;text-align:right}.brow .c-note{grid-area:note}.brow .c-msg{display:none}}
</style>
</head>
<body>
<div class="bar pad"><div class="inner">
  <div class="brand"><b id="ttl"></b><span id="sub"></span></div>
  <div class="conn" id="conn" data-s="wait"><i></i><span id="connTxt"></span></div>
  <div class="ctl">
    <div class="seg" role="group" aria-label="Role">
      <button type="button" id="roleKR" aria-pressed="true">한국 직원</button>
      <button type="button" id="roleCN" aria-pressed="false">中国负责人</button>
      <button type="button" id="roleMS" aria-pressed="false">마스터</button>
    </div>
    <div class="seg" role="group" aria-label="Language">
      <button type="button" id="langKO" aria-pressed="true">한국어</button>
      <button type="button" id="langZH" aria-pressed="false">中文</button>
    </div>
    <button type="button" class="btn" id="logoutBtn" hidden></button>
  </div>
</div></div>

<main class="pad"><div class="inner">
  <section id="login" hidden><form id="loginForm" class="loginbox" autocomplete="off">
    <h2 id="lgTitle"></h2><p id="lgSub"></p>
    <div class="fld"><label id="lgNameL" for="lgName"></label><input id="lgName" required></div>
    <div class="fld"><label id="lgPassL" for="lgPass"></label><input id="lgPass" type="password" required autocomplete="current-password"></div>
    <p id="lgErr" class="err" hidden></p>
    <button type="submit" class="btn primary" id="lgOk"></button>
  </form></section>
  <div id="banner" class="banner" hidden></div>
  <div id="app"><div class="seg brandbar" id="brandbar" role="group"></div><div class="strip" id="strip"></div>
  <div class="flow" id="flow" aria-hidden="true"></div>

  <div class="tools">
    <div class="tabs" role="tablist">
      <button type="button" role="tab" id="tabList" aria-selected="true"></button>
      <button type="button" role="tab" id="tabArr" aria-selected="false"></button>
      <button type="button" role="tab" id="tabBuy" aria-selected="false"></button>
    </div>
    <input class="search" id="q" type="search" autocomplete="off">
    <button type="button" class="btn" id="selBtn"></button>
    <button type="button" class="btn primary" id="addBtn"></button>
  </div>

  <section id="viewList"></section>
  <section id="viewArr" hidden></section>
  <section id="viewBuy" hidden></section></div>
</div></main>

<div id="layer"></div>

<dialog id="newDlg">
  <h2 id="ndTitle"></h2>
  <form id="ndForm" method="dialog">
    <div class="grid2">
      <div class="fld full"><label id="ndNameL" for="ndName"></label><input id="ndName" required></div>
      <div class="fld"><label id="ndColorL" for="ndColor"></label><input id="ndColor"></div>
      <div class="fld"><label id="ndSizeL" for="ndSize"></label><input id="ndSize"></div>
      <div class="fld"><label id="ndQtyL" for="ndQty"></label><input id="ndQty" type="number" min="0" inputmode="numeric"></div>
      <div class="fld"><label id="ndBrandL" for="ndBrand"></label><select id="ndBrand"></select></div>
      <div class="fld"><label id="ndStatL" for="ndStat"></label><select id="ndStat"></select></div>
    </div>
    <div class="actions">

    return r.text().then(function(tx){

function shrink(file,max,q){
  return new Promise(function(res,rej){
    var url=URL.createObjectURL(file),im=new Image();
    im.onload=function(){var w=im.naturalWidth,h=im.naturalHeight,s=Math.min(1,max/Math.max(w,h)),c=document.createElement('canvas');c.width=Math.round(w*s);c.height=Math.round(h*s);var g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',q))};
    im.onerror=function(){URL.revokeObjectURL(url);rej(new Error('img'))};
    im.src=url;
  });
}

}
function logout(wrong){
  S.authed=false;pass='';clearInterval(pollTimer);lastSig='';S.orders=[];S.msgs=[];closeDrawer();lsSet('lvPass','');renderAll();
  if(wrong){var el=$('lgErr');el.hidden=false;el.textContent=t('lgBad')}
}

/* events */
document.addEventListener('click',function(e){
  var el=e.target.closest('button,.scrim');if(!el)return;
  if(el.dataset&&el.dataset.add!==undefined){if(!S.authed)return;S.addStyle=el.dataset.style||'';$('ndForm').reset();$('ndStat').value='ordered';$('ndBrand').value=el.dataset.brand||'lovlov';$('ndName').value=el.dataset.add;$('newDlg').showModal();$('ndColor').focus();return}
  if(el.dataset&&el.dataset.bm){S.buyMode=el.dataset.bm;renderBuy();return}
  if(el.dataset&&el.dataset.b){S.brand=el.dataset.b;lsSet('lvBrand',S.brand);renderAll();return}
  if(el.dataset&&el.dataset.f){S.filter=el.dataset.f;if(S.tab!=='list'){S.tab='list';location.hash='list'}renderAll();return}
  if(el.dataset&&el.dataset.gsel){var gr=grpRows(el.dataset.gsel).filter(matches),all=gr.every(function(o){return S.sel[o.id]});gr.forEach(function(o){S.sel[o.id]=!all});renderList();return}
  if(el.dataset&&el.dataset.grp){openGroup(el.dataset.grp);return}
  if(el.classList.contains('row')){if(S.selMode){S.sel[el.dataset.id]=!S.sel[el.dataset.id];renderList();return}openDrawer(el.dataset.id);return}
  switch(el.id){
    case 'roleKR':S.role='kr';lsSet('lvRole','kr');if(!lsGet('lvLangSet')){S.lang='ko'}renderAll();if(S.openId)reopen();break;
    case 'roleMS':askMaster(false);break;
    case 'roleCN':S.role='cn';lsSet('lvRole','cn');if(!lsGet('lvLangSet')){S.lang='zh'}renderAll();if(S.openId)reopen();break;
    case 'langKO':S.lang='ko';lsSet('lvLang','ko');lsSet('lvLangSet','1');renderAll();if(S.openId)reopen();break;
    case 'langZH':S.lang='zh';lsSet('lvLang','zh');lsSet('lvLangSet','1');renderAll();if(S.openId)reopen();break;
    case 'tabList':S.tab='list';location.hash='list';renderAll();break;
    case 'tabArr':S.tab='arr';location.hash='arrivals';renderAll();break;
    case 'tabBuy':S.tab='buy';location.hash='buy';renderAll();break;
    case 'selBtn':S.selMode=!S.selMode;if(!S.selMode)selClear();renderList();break;
    case 'selApply':selApplyNow();break;
    case 'selAll':S.orders.filter(matches).forEach(function(o){S.sel[o.id]=true});renderList();break;
    case 'selCancel':selClear();renderList();break;
    case 'addBtn':S.addStyle='';$('ndForm').reset();$('ndBrand').value=S.brand==='lessetter'?'lessetter':'lovlov';$('ndStat').value='draft';$('newDlg').showModal();$('ndName').focus();break;
    case 'ndCancel':$('newDlg').close();break;
    case 'scrim':case 'dClose':closeDrawer();break;
    case 'msgSend':sendMsg();break;
    case 'phDel':deletePhoto();break;
    case 'dDel':
      if(el.dataset.arm){var id=S.openId;closeDrawer();S.orders=S.orders.filter(function(x){return x.id!==id});renderAll();pending++;done(rpc('delete_order',{p:pass,oid:id}))}
      else{el.dataset.arm='1';el.textContent=t('delConfirm');delTimer=setTimeout(function(){if(el.isConnected){delete el.dataset.arm;el.textContent=t('del')}},3500)}
      break;
  }
});
function reopen(){var id=S.openId;closeDrawer();if(id)openDrawer(id)}
document.addEventListener('change',function(e){
  var el=e.target;
  if(el.id==='phFile'){var pf=el.files&&el.files[0];el.value='';if(pf)uploadPhoto(pf);return}
  if(el.dataset&&el.dataset.gk&&S.grp){groupChange(el);return}
  if(!el.dataset||!el.dataset.k||!S.openId)return;
  var k=el.dataset.k,v=el.value;
  if(el.type==='number')v=v===''?null:Math.max(0,Number(v));
  else if(el.type==='text'||el.tagName==='TEXTAREA')v=String(v).trim();
  var o=byId(S.openId);if(o&&String(o[k]==null?'':o[k])===String(v==null?'':v))return;
  var patch={};patch[k]=v;save(S.openId,patch);
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&(S.openId||S.grp)&&!$('newDlg').open)closeDrawer();
  if(e.target&&e.target.id==='msgText'&&e.key==='Enter'&&!e.shiftKey&&!e.isComposing&&e.keyCode!==229){e.preventDefault();sendMsg()}
});
$('q').addEventListener('input',function(e){S.q=e.target.value.trim();renderList();renderArr();renderBuy()});
$('ndForm').addEventListener('submit',function(e){
  e.preventDefault();
  if(!S.authed){$('newDlg').close();return}
  var name=$('ndName').value.trim();if(!name)return;
  var q=$('ndQty').value;
  var doc={color:$('ndColor').value.trim(),size:$('ndSize').value.trim(),qty:q===''?0:Math.max(0,Number(q)),status:$('ndStat').value,etaConf:'unknown',style:S.addStyle||'',brand:$('ndBrand').value,createdAt:Date.now(),updatedAt:Date.now(),updatedName:uname,updatedSide:sd()};
  doc.name=name;
  $('newDlg').close();
  var id=newId();S.orders.push(Object.assign({id:id},doc));renderAll();openDrawer(id);pending++;done(rpc('save_order',{p:pass,oid:id,patch:doc}));
});
function tabFromHash(){return location.hash==='#arrivals'?'arr':(location.hash==='#buy'?'buy':'list')}
window.addEventListener('hashchange',function(){S.tab=tabFromHash();renderAll()});

/* boot */
S.role=lsGet('lvRole')==='cn'?'cn':'kr';
S.brand=['lovlov','lessetter'].indexOf(lsGet('lvBrand'))>=0?lsGet('lvBrand'):'all';
S.lang=lsGet('lvLang')==='zh'?'zh':(lsGet('lvLang')==='ko'?'ko':(S.role==='cn'?'zh':'ko'));
S.tab=tabFromHash();
renderAll();
$('loginForm').addEventListener('submit',function(e){e.preventDefault();var n=$('lgName').value.trim(),p=$('lgPass').value;if(!n||!p)return;$('lgErr').hidden=true;tryLogin(p,n,false)});
$('logoutBtn').addEventListener('click',function(){logout(false)});
document.addEventListener('visibilitychange',function(){if(!document.hidden)poll()});
var sp=lsGet('lvPass'),sn=lsGet('lvName');if(sn)$('lgName').value=sn;
if(sp&&sn)tryLogin(sp,sn,true);
})();
</script>
</body>
</html>
